# ================================================================
# GraphGPS — JS Library Detection (whole-program CPG + k-hop)
#
# Difference from libs_scan.yaml
# --------------------------------
# - dataset.loader_type: entire  → uses JSLibsEntireDataset
#   (loads _program.xml, extracts k-hop ego subgraphs around
#    every function-entry node)
# - dataset.max_depth: 3         → BFS radius; set equal to gt.layers
# - Closed mode: subgraphs from the same bundle are split
#   train/val/test locally (no lib-level separation)
# - gt.layers / dim_hidden bumped: k-hop subgraphs carry richer
#   structural context → deeper model benefits more
# - batch_size: 32               → subgraphs are smaller than full
#   function graphs so larger batches fit in memory
#
# Run
# ---
# python main.py --cfg configs/custom/libs_scan_entire.yaml wandb.use False
# ================================================================

out_dir: results
metric_best: accuracy-JS
metric_agg: argmax
name_tag: v1-entire

wandb:
  use: False
  project: js-lib-similarity

# ----------------------------------------------------------------
# Dataset
# ----------------------------------------------------------------
dataset:
  format: PyG-JSLibs
  name: JSLibs
  task: graph
  task_type: classification
  transductive: False

  # ── encoders ──────────────────────────────────────────────────
  node_encoder: True
  node_encoder_name: CPGNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: CPGEdge
  edge_encoder_bn: False

  split_index: 0
  split_mode: standard

  # ── paths (adjust to your setup) ──────────────────────────────
  data_dir:  /home/aiuser4/ado/bundled-js-scan/data/train/v2.2
  label_map_path: datasets/JSLibs/raw/split.json

  # ── vocab (set after running cpg_vocab.py) ────────────────────
  node_encoder_vocab_size: 0    # 0 = hash fallback

  # ── size filters ──────────────────────────────────────────────
  min_nodes: 5
  max_nodes: 500        # tighter than libs_scan: subgraphs are bounded

  # ── bundler / lib filters (empty = include everything) ────────
  bundler_filter: [rollup@4.46.2, rollup@4.46.3]
  lib_filter: [async]

  # ── JSLibsEntire-specific ──────────────────────────────────────
  loader_type: entire           # use JSLibsEntireDataset

  # k-hop BFS radius around each function-entry node.
  # Rule of thumb: set equal to gt.layers so each node's receptive
  # field matches the subgraph radius.
  max_depth: 2

  # 0 = no limit. Set e.g. 20 for fast debug runs.
  max_graphs_per_bundler: 20

  # Closed-mode: fraction of each bundle's subgraphs → train / val.
  # Remainder goes to test.
  closed_train_ratio: 0.70
  closed_val_ratio: 0.15

# ----------------------------------------------------------------
# Positional Encoding — LapPE
# ----------------------------------------------------------------
# k-hop subgraphs have more consistent structure than isolated
# function graphs, so LapPE is more stable here. Start disabled
# and enable once you have ≥ 200 subgraphs per split.
posenc_LapPE:
  enable: False
  eigen:
    laplacian_norm: none      # none = correct for directed CPGs
    eigvec_norm: L2
    max_freqs: 8
  model: DeepSet
  dim_pe: 16
  layers: 2
  n_heads: 4
  raw_norm_type: none

# ----------------------------------------------------------------
# Structural Encoding — RWSE
# ----------------------------------------------------------------
# Random-walk SE captures local topology well for ego subgraphs.
posenc_RWSE:
  enable: True
  kernel:
    times: [1, 2, 4, 8, 16]
  model: Linear
  dim_pe: 16
  raw_norm_type: none

# ----------------------------------------------------------------
# Training
# ----------------------------------------------------------------
train:
  mode: custom
  batch_size: 32        # subgraphs are smaller → larger batches safe
  eval_period: 1
  ckpt_period: 100
  enable_ckpt: True
  ckpt_best: True

# ----------------------------------------------------------------
# Model
# ----------------------------------------------------------------
model:
  type: GPSModel
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: max    # one function match is enough to detect lib

# ----------------------------------------------------------------
# GPS layers
# ----------------------------------------------------------------
# gt.layers should equal dataset.max_depth so each node's
# message-passing receptive field covers the full k-hop subgraph.
# dim_hidden bumped to 128: richer subgraph features justify it.
gt:
  layer_type: CustomGatedGCN+Performer
  layers: 4             # = max_depth
  n_heads: 4
  dim_hidden: 128       # MUST match gnn.dim_inner
  dropout: 0.1
  attn_dropout: 0.5
  layer_norm: False
  batch_norm: True

# ----------------------------------------------------------------
# GNN head
# ----------------------------------------------------------------
gnn:
  head: default
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 128        # MUST match gt.dim_hidden
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: max
  normalize_adj: False

# ----------------------------------------------------------------
# Optimizer
# ----------------------------------------------------------------
# More subgraphs per epoch → training converges faster →
# fewer epochs + slightly higher base_lr.
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0005
  max_epoch: 20
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
  steps: [90, 120]
  lr_decay: 0.1
  reduce_factor: 0.5
  schedule_patience: 10
  min_lr: 1e-6
  momentum: 0.9