# ================================================================
# GraphGPS — JS Library Obfuscation Detection
# Run: python main.py --cfg configs/custom/jslibs.yaml wandb.use False
# ================================================================

out_dir: results
metric_best: accuracy-JS
metric_agg: argmax
name_tag: v6

wandb:
  use: False   # disable until pipeline is validated
  project: js-lib-similarity

# ----------------------------------------------------------------
# Dataset
# ----------------------------------------------------------------
num_workers: 2        # parallelize data loading and preprocessing

dataset:
  format: PyG-JSLibs
  name: JSLibs
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: CPGNode    # ← removed LapPE until dataset is large enough
  node_encoder_bn: False        # single encoder, no BN needed
  edge_encoder: True
  edge_encoder_name: CPGEdge
  edge_encoder_bn: False
  split_index: 0
  split_mode: standard
  data_dir: /home/aiuser4/ado/bundled-js-scan/data/train/v2.2  # ← new
  min_nodes: 5        # ← new
  max_nodes: 2000     # ← new
  bundler_filter: [rollup@4.46.2, webpack@5.95.0]  # e.g. [rollup@4.46.2, webpack@5.95.0] # ← new
  lib_filter : [async, axios, lodash, express, chalk, commander, react, request, rxjs, uuid] # e.g. ['axios@1.7.9', 'lodash', 'chalk@5.3.0'] # ← new
  graph_type: entire  # ← func/entire: read per-function or entire graph then extract subgraphs in-memory
  max_depth: 3       # ← max depth for subgraph extraction (entire graph mode only)
  closed_train_ratio: 0.70
  closed_val_ratio: 0.15

# ----------------------------------------------------------------
# Positional Encoding — LapPE
# ----------------------------------------------------------------
# DISABLED: with < 50 graphs per lib, eigenvectors are unstable.
# Re-enable once you have 200+ graphs per split and ≥ 10 libs.
posenc_LapPE:
  enable: False
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 8
  model: DeepSet
  dim_pe: 16
  layers: 2
  n_heads: 4
  raw_norm_type: none

# ----------------------------------------------------------------
# Structural Encoding — RWSE
# ----------------------------------------------------------------
# Keep enabled: loop/branch patterns are stable and cheap to compute.
posenc_RWSE:
  enable: True
  kernel:
    times: [1, 2, 4, 8, 16]
  model: Linear
  dim_pe: 16
  raw_norm_type: none

# ----------------------------------------------------------------
# Training
# ----------------------------------------------------------------
train:
  mode: custom
  batch_size: 8         # ← smaller: avoids padding waste with tiny graphs
  eval_period: 1
  ckpt_period: 100
  enable_ckpt: True
  ckpt_best: True

# ----------------------------------------------------------------
# Model
# ----------------------------------------------------------------
model:
  type: GPSModel
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: max

# ----------------------------------------------------------------
# GPS layers
# ----------------------------------------------------------------
gt:
  layer_type: CustomGatedGCN+Performer
  layers: 3             # ← reduced from 4: less overfitting risk with small data
  n_heads: 4
  dim_hidden: 64        # ← reduced from 128: fewer params for tiny dataset
  dropout: 0.1
  attn_dropout: 0.5
  layer_norm: False
  batch_norm: True

# ----------------------------------------------------------------
# GNN head
# ----------------------------------------------------------------
gnn:
  head: default
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 64         # ← MUST match gt.dim_hidden
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: max
  normalize_adj: False

# ----------------------------------------------------------------
# Optimizer
# ----------------------------------------------------------------
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.001        # ← increased from 0.0002: warmup was masking the dead lr
  max_epoch: 200        # ← more epochs to compensate for fewer graphs
  scheduler: cosine_with_warmup
  num_warmup_epochs: 2  # ← reduced from 8: 8 epochs of lr=0 killed early training
  steps: [120, 160]
  lr_decay: 0.1
  reduce_factor: 0.5
  schedule_patience: 10
  min_lr: 1e-6
  momentum: 0.9